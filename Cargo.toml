[workspace]
resolver = "2"
members = ["crates/leolib", "crates/leolsp", "crates/leomcp", "crates/leoapp", "crates/leotui", "crates/leogui"]

[workspace.package]
version = "0.6.1"
edition = "2021"
# leoapp's floor: tree-sitter-language 0.1.8 requires 1.90. leolib sets its own.
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/shakfu/leo-rs"
readme = "README.md"

[workspace.dependencies]
# Keep in step with [workspace.package] version.
leolib = { path = "crates/leolib", version = "0.6.1" }
leolsp = { path = "crates/leolsp", version = "0.6.1" }
leomcp = { path = "crates/leomcp", version = "0.6.1" }
leoapp = { path = "crates/leoapp", version = "0.6.1" }

[profile.release]
lto = true
