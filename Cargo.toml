[workspace]
resolver = "2"
members = ["crates/leolib", "crates/leotui"]

[workspace.package]
version = "0.2.1"
edition = "2021"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/shakfu/leo-rs"
readme = "README.md"

[workspace.dependencies]
# Keep in step with [workspace.package] version.
leolib = { path = "crates/leolib", version = "0.2.1" }

[profile.release]
lto = true
