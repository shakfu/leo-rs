[package]
name = "leo-markdown"
description = "Markdown, R Markdown and Quarto files as leo-rs outline trees: a CommonMark scanner and exact writer, and the @qmd and @rmd kinds."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["leo", "markdown", "quarto", "rmarkdown", "outliner"]
categories = ["parser-implementations", "text-processing"]

[features]
# Entry points for the targets in fuzz/; not an API.
fuzzing = []

[dependencies]
leolib.workspace = true
regex = "1"

[dev-dependencies]
tempfile = "3"
