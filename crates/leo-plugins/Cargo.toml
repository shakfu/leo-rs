[package]
name = "leo-plugins"
description = "The plugins a leo-rs front end offers: the leolib kinds and leoapp plugins, chosen by cargo feature and registered at startup."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["leo", "outliner", "plugins"]
categories = ["text-editors"]

[features]
# leo-entangled is not here until it is published: crates.io refuses a
# dependency it does not have, even an optional one.
default = ["markdown", "wiki"]
markdown = ["dep:leo-markdown"]
wiki = ["dep:leo-wiki"]

[dependencies]
leolib.workspace = true
leoapp.workspace = true
leo-markdown = { workspace = true, optional = true }
leo-wiki = { workspace = true, optional = true, features = ["leoapp"] }

[dev-dependencies]
tempfile = "3"
