[package]
name = "leotui"
description = "A terminal front end for leolib."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
# Reads the workspace README at ../../README.md, which the package lacks.
exclude = ["tests/readme.rs"]

# The library's name is the binary's too, so the binary is not documented:
# `cargo doc` would write both to one place.
[[bin]]
name = "leotui"
path = "src/main.rs"
doc = false

[dependencies]
leolib.workspace = true
leoapp.workspace = true
leo-plugins.workspace = true
# osc52: a yank goes to the system clipboard through the terminal.
crossterm = { version = "0.29", features = ["osc52"] }
ratatui = "0.30"
clap = { version = "4", features = ["derive"] }

# Already in the build through crossterm; a hangup ends the session with a
# recovery copy rather than killing the process.
[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"

[dev-dependencies]
# Already in the build through leolib; a test sets an hlsearch pattern.
regex = "1"
