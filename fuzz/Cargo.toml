# cargo-fuzz targets for the parsers that read untrusted files.
#
#     cargo +nightly fuzz run read_into_root
#     cargo +nightly fuzz run pickle
#     cargo +nightly fuzz run read_leo
#     cargo +nightly fuzz run markdown
#     cargo +nightly fuzz run markdown_rename
#     cargo +nightly fuzz run line_import
#     cargo +nightly fuzz run undo
#     cargo +nightly fuzz run jupytext
#
# Outside the workspace, as cargo-fuzz expects: it needs nightly, and the
# workspace builds on stable.
[package]
name = "leolib-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
leolib = { path = "../crates/leolib", features = ["fuzzing"] }
leo-markdown = { path = "../crates/leo-markdown", features = ["fuzzing"] }

[workspace]
members = ["."]

[[bin]]
name = "read_into_root"
path = "fuzz_targets/read_into_root.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pickle"
path = "fuzz_targets/pickle.rs"
test = false
doc = false
bench = false

[[bin]]
name = "read_leo"
path = "fuzz_targets/read_leo.rs"
test = false
doc = false
bench = false

[[bin]]
name = "markdown"
path = "fuzz_targets/markdown.rs"
test = false
doc = false
bench = false

[[bin]]
name = "markdown_rename"
path = "fuzz_targets/markdown_rename.rs"
test = false
doc = false
bench = false

[[bin]]
name = "line_import"
path = "fuzz_targets/line_import.rs"
test = false
doc = false
bench = false

[[bin]]
name = "undo"
path = "fuzz_targets/undo.rs"
test = false
doc = false
bench = false

[[bin]]
name = "jupytext"
path = "fuzz_targets/jupytext.rs"
test = false
doc = false
bench = false
